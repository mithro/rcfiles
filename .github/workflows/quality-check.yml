---
name: Quality Checks

on:
  push:
    branches: [master, main]
  # Deliberately unfiltered: `branches:` here matches the BASE branch, so
  # restricting it to master/main skipped every stacked pull request -- a PR
  # targeting another feature branch got no checks at all. That matters more
  # now these jobs are the only definition of the quality gate.
  pull_request:

# Every job drives the same make targets a developer runs locally, against the
# same uv-built virtualenv (see the Makefile). Keeping one definition of the
# tool set and the exclusion lists is what stops local and CI results from
# quietly disagreeing -- they had already diverged when this replaced the
# hand-rolled pip install steps and the shellcheck action.
#
# setup-uv is pinned to an exact release because the action publishes no moving
# major tag.

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # Don't check submodules

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Run ShellCheck
        run: make shellcheck

  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # Don't check submodules

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Run ruff linter
        run: make python-lint

      - name: Run ruff formatter check
        run: make python-format

  yaml-quality:
    name: YAML Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Run yamllint
        run: make yaml-lint

  file-quality:
    name: File Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # No uv needed: these checks are pure git grep.
      - name: Check trailing whitespace and tabs
        run: make file-checks

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # ssh/tests exercises tmux/zprofile, which is a zsh script. Not installed
      # on ubuntu-latest by default.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run tests
        run: make test
