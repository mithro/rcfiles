
# set == set-option
# -g == "Global setting", IE effect all windows

# Fix vim mode switching delay - eliminates delay when pressing Escape in vim
set -s escape-time 0

# Enable focus events for vim/neovim autoread and other plugins
set -g focus-events on

# Our shell is set to zsh which lanuches tmux, but we really want bash in the end.
# default-command sets the *program* run in new panes; default-shell sets the $SHELL
# env var tmux stamps into every pane. Both are needed: without default-shell, tmux
# uses the zsh login shell for $SHELL and only an interactive .bashrc rewrites it, so
# panes launched with an explicit command (e.g. `tmux new-window 'cmd'`) keep zsh.
set -g default-shell /bin/bash
set -g default-command bash

# Increase the scrollback history to be much bigger.
set -g history-limit 10000

# Support utf8 please!
#setw -g utf8 on
set -g base-index 0

# AM/PM clock please
set -g clock-mode-style 12

# Values to update from the environment of the creating terminal. This allows X
# applications and SSH forwarding to work.
set -g default-terminal "tmux-256color"

# Clipboard: allow tmux AND programs inside tmux to set system clipboard via OSC 52
set -s set-clipboard on

# Passthrough: allow kitty-specific escape sequences (images, notifications, kittens)
set -g allow-passthrough on

# Extended keys: enable modified key reporting (Ctrl+Shift+x, Shift+Enter, etc.)
set -s extended-keys on

# Mouse: enable mouse for pane selection, resize, scrolling
# Hold Shift to bypass tmux and let kitty handle selection directly
set -g mouse on

# Ensure all xterm-family terminals get 256-color and RGB (truecolor) support.
# When connecting via SSH, TERM often arrives as plain "xterm" (8 colors) even when
# the actual terminal (e.g. kitty) supports full color. This forces the upgrade.
set -as terminal-features ',xterm*:256:RGB'

# Kitty terminal features: remove old entry first to prevent duplication on reload
set -us terminal-features ',xterm-kitty'
# Consolidated terminal features for kitty
set -as terminal-features ',xterm-kitty:RGB:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:mouse:osc7:overline:strikethrough:sync:title:usstyle'

set -g update-environment "DISPLAY SSH_ASKPATH SSH_CONNECTION WINDOWID XAUTHORITY XDG_SESSION_COOKIE DBUS_SESSION_BUS_ADDRESS GNOME_KEYRING_CONTROL GNOME_KEYRING_PID GNOME_KEYRING_SOCKET ORBIT_SOCKETDIR KRB5CCNAME SESSION_MANAGER PATH"

# We prefer Ctrl-A rather then Ctrl-B
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# New windows and splits should use the working directory of the current pane
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Make it really easy to detach :)
bind d detach-client
bind D detach-client
bind C-d detach-client
bind C-D detach-client

# Enable shift-pageup/pagedown for scrolling
bind-key -n S-PgUp copy-mode -eu
bind-key -n S-PgDn copy-mode -e \; send-keys -X page-down
bind-key -T copy-mode S-PgUp send-keys -X page-up
bind-key -T copy-mode S-PgDn send-keys -X page-down
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Resize as much as possible
setw -g aggressive-resize on

# Pretty titles
set -g set-titles on
setw -g automatic-rename

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# Setup a set of default colors
set -g status-style bg=cyan,fg=black
#set -g status-left '#[fg=green]#H'
set-window-option -g window-status-current-style bg=red,fg=black
#set -g status-right ‘#[fg=yellow]#(uptime | cut -d “,” -f 2-)’
set -g status-right '#(hostname -s) #(TZ="Australia/Adelaide" date +"%I:%M%p") '

# ── Plugins ──────────────────────────────────────────────────────────
# TPM (tmux plugin manager) is vendored as a git submodule at
# ~/rcfiles/tmux/plugins/tpm (pinned; updated via git, not prefix+U).
# The plugins TPM manages are cloned OUTSIDE the repo into
# ~/.tmux/plugins/ (TMUX_PLUGIN_MANAGER_PATH below).
#   prefix+I = install plugins   prefix+U = update plugins
#
# tmux-resurrect: prefix+Ctrl-s = save, prefix+Ctrl-r = restore.
# tmux-continuum: autosaves every 15 min. Restore stays MANUAL --
# @continuum-restore is deliberately not set, so a fresh server never
# auto-loads stale state.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save pane scrollback contents...
set -g @resurrect-capture-pane-contents 'on'
# ...and relaunch these programs on restore, in addition to resurrect's
# conservative defaults (vi vim nvim emacs man less more tail top htop).
set -g @resurrect-processes 'ssh mosh-client claude'

set -g @continuum-save-interval '15'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Keep this run-shell as the LAST line of this base file. Host-specific
# parts appended after it by setup.sh linkit() may safely override
# display options (e.g. status-right): run-shell jobs execute only
# after the whole generated config is parsed, so continuum wraps the
# FINAL status-right with its autosave hook. Host parts must NOT set
# @resurrect-*/@continuum-* options (too late by then). If autosave
# ever stops, check: tmux show -g status-right  (should contain
# continuum_save.sh).
if-shell "test -x ~/rcfiles/tmux/plugins/tpm/tpm" \
    "run-shell ~/rcfiles/tmux/plugins/tpm/tpm"
