# Configuration for kitty's ssh kitten (`kitten ssh`), which bash/include/kitty
# aliases over ssh when running inside kitty.
#
# Don't let the ssh kitten manage its own ControlMaster sockets. By default
# (share_connections yes) it injects
#   -o ControlMaster=auto -o ControlPath=$XDG_RUNTIME_DIR/kssh-<kitty_pid>-%C
#   -o ControlPersist=yes
# on the ssh command line, and command-line options override ~/.ssh/config,
# so mux masters end up in $XDG_RUNTIME_DIR instead of ~/.ssh/tmp/ where
# ssh/config puts them (breaking socket reuse with non-kitty ssh invocations).
# There is no kitten option to relocate its socket; the only knob is turning
# its connection sharing off, which removes the whole injection block so the
# ControlPath/ControlMaster settings from ~/.ssh/config apply as written.
share_connections no
