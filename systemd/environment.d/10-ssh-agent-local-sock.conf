# Desktop: make the local ssh-agent (ssh-agent.service -> ssh-agent-start.sh ->
# ~/.ssh/agent/local.sock) the SINGLE session-wide agent. gcr's ssh-agent is
# masked (see setup.sh tmux_persistence), so with no other setter, this is what
# sets SSH_AUTH_SOCK for the whole user session: the GUI, kitty, bare shells, and
# (redundantly) tmux. gnome-keyring's secrets/pkcs11 are separate and untouched.
SSH_AUTH_SOCK=${HOME}/.ssh/agent/local.sock
