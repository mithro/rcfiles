# All hosts: make the per-host "front" agent socket the SINGLE session-wide
# ssh-agent — for the GUI, kitty, bare shells, and tmux alike (so nothing falls
# back to gcr or to no agent). front.sock is symlinked per host by setup.sh
# (tmux_persistence): -> mux.sock on servers (local + forwarded keys), ->
# local.sock on laptops (local agent only). This is the same socket tmux-server.service
# pins, so in-tmux and out-of-tmux see the identical agent.
# gcr's ssh-agent is masked (setup.sh) so nothing competes; gnome-keyring's
# secrets/pkcs11 are a separate daemon and untouched.
SSH_AUTH_SOCK=${HOME}/.ssh/agent/front.sock
