[Unit]
After=ssh-agent.service
Wants=ssh-agent.service

[Service]
# ssh-agent-mux does not unlink its own listening socket, and it exits when its
# upstream forwarded agent goes away (e.g. an SSH reconnect rotates the forwarded
# socket). With Restart=always that left a stale ~/.ssh/agent/mux.sock, so every
# restart failed to bind with EADDRINUSE and burned through the start limit ->
# service stuck "failed". Clear the stale socket first so restarts rebind cleanly.
ExecStartPre=-/usr/bin/rm -f %h/.ssh/agent/mux.sock
Restart=always
RestartSec=1
LimitCORE=infinity
